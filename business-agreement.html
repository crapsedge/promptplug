<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Business Agreement Text Test</title>
</head>

<body>

<h1>Business Agreement Text Test</h1>

<p>Diagnostic test only. Not a binding agreement.</p>

<p id="status">Loading complete business agreement...</p>

<form action="https://api.web3forms.com/submit" method="POST">

  <input type="hidden" name="access_key"
         value="1e7fcd38-95a7-4b9e-8e93-d25b3b6e1c3d">

  <input type="hidden" name="subject"
         value="Omaha Restoration - Full Agreement Text Test">

  <input type="hidden" name="name"
         value="Test Business">

  <input type="hidden" name="Test_Status"
         value="DIAGNOSTIC TEST ONLY - NOT A CONTRACT">

  <input type="hidden" name="Agreement_Version"
         value="OR-BCSA-2026-V5">

  <input type="hidden" name="Agreement_Text"
         id="agreementText">

  <input type="hidden" name="message"
         value="Testing delivery of the complete contractual text.">

  <button type="submit" id="submitBtn" disabled>
    Send Full Agreement Test
  </button>

</form>

<script>

async function loadAgreement(){

  const status = document.getElementById("status");
  const button = document.getElementById("submitBtn");

  try {

    const response = await fetch(
      "./business-agreement.html",
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("Business agreement page could not be loaded.");
    }

    const html = await response.text();

    const documentCopy = new DOMParser()
      .parseFromString(html,"text/html");

    const agreement = documentCopy
      .getElementById("legalAgreement");

    if(!agreement){
      throw new Error("Agreement text could not be located.");
    }

    const headings = agreement.querySelectorAll("h3");

    if(headings.length !== 14){
      throw new Error("Expected 14 contractual sections.");
    }

    const container = document.createElement("div");

    container.style.position = "absolute";
    container.style.left = "-99999px";
    container.style.width = "800px";

    container.innerHTML = agreement.innerHTML;

    document.body.appendChild(container);

    const text =
      "OR-BCSA-2026-V5\n\n" +
      container.innerText.trim();

    container.remove();

    document.getElementById("agreementText").value = text;

    const bytes = new TextEncoder().encode(text).length;

    status.textContent =
      "Ready. Loaded " + headings.length +
      " contractual sections, " +
      text.length + " characters, " +
      bytes + " bytes.";

    button.disabled = false;

  } catch(error){

    status.textContent = "ERROR: " + error.message;

    button.disabled = true;

  }

}

loadAgreement();

</script>

</body>
</html>
